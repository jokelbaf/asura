name: Create Release

on:
  push:
    branches:
      - master
    paths:
      - 'Cargo.toml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jokelbaf/rust-release@master
