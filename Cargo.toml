[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
    "crates/common",
    "crates/capture",
    "crates/helper",
    "crates/authority",
    "crates/proxy",
    "crates/session",
    "crates/formats",
    "crates/trust",
    "crates/control",
    "crates/launcher",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
homepage = "https://asura.nekolab.app"

[workspace.dependencies]
common = { path = "crates/common" }
ebpf = { path = "crates/ebpf" }
capture = { path = "crates/capture" }
authority = { path = "crates/authority" }
proxy = { path = "crates/proxy" }
session = { path = "crates/session" }
formats = { path = "crates/formats" }
trust = { path = "crates/trust" }
control = { path = "crates/control" }

aya = { version = "0.14.0", default-features = false }
aya-build = "0.2.0"
aya-ebpf = "0.2.1"
aya-obj = "0.3.0"

anyhow = "1.0.104"
thiserror = "2.0.21"
libc = "0.2.189"
rustix = { version = "1.1.5", features = ["net", "process", "fs", "param"] }
zbus = "5.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
clap = { version = "4.6.7", features = ["derive"] }

tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
futures-util = "0.3.34"
bytes = "1.12.1"
http = "1.5.0"
httparse = "1.10.1"
hyper = { version = "1.11.1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
rustls = "0.23.45"
tokio-rustls = "0.26.6"
rustls-platform-verifier = "0.7.1"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-parser = "0.18.1"
lru = "0.18.5"
memchr = "2.8.3"
regex = "1.13.1"
parking_lot = "0.12.5"

flate2 = "1.1.10"
brotli = "9.0.0"
zstd = "0.14.0"
base64 = "0.23.1"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
url = "2.5.8"
sha1 = "0.11.0"
hex = "0.4.3"

gtk = { package = "gtk4", version = "0.11.5", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
sourceview = { package = "sourceview5", version = "0.11.2", features = ["v5_18"] }
async-channel = "2.5.0"
directories = "6.0.0"
tempfile = "3.27.0"

[profile.release.package.ebpf]
debug = 2
codegen-units = 1
